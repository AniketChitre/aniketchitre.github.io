<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>CV — Aniket Chitre</title>
  <link rel="stylesheet" href="style.css" />

<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">Aniket Chitre</a>

        <span></span>
        <span></span>

      <ul class="nav__links" role="list">

        <li><a href="work.html"         class="nav__link">Work</a></li>
        <li><a href="publications.html" class="nav__link">Publications</a></li>

      <a href="images/AniketChitre_CV.pdf" class="btn btn--primary" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>

    </section>
  </main>

  <!-- Footer -->
  <footer class="footer container">
    <div class="footer__inner">
      <p class="footer__copy">&copy; 2026 Aniket Chitre</p>

  <script>
    const toggle = document.querySelector('.nav__toggle');
    const links  = document.querySelector('.nav__links');
    toggle.addEventListener('click', () => {
      const open = links.classList.toggle('nav__links--open');
      toggle.setAttribute('aria-expanded', open);
    });
  </script>
